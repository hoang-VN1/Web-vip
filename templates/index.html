<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web API Platform</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Web API Platform</h1>
            <div class="user-info">
                <a href="/login" class="btn btn-primary">Đăng nhập</a>
                <a href="/register" class="btn btn-ghost">Đăng ký</a>
            </div>
        </div>
        <div style="text-align:center;padding:60px 0;">
            <h1 style="font-size:48px;background:linear-gradient(135deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">🔥 Web API Platform</h1>
            <p style="color:#8b949e;font-size:18px;margin:20px 0;">Hệ thống quản lý API, Bot, Uptime, Shield, Quest, Exec, CreAPI</p>
            <div style="display:flex;gap:15px;justify-content:center;flex-wrap:wrap;">
                <a href="/login" class="btn btn-primary">Bắt đầu ngay</a>
                <a href="/register" class="btn btn-ghost">Đăng ký</a>
            </div>
            <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;max-width:800px;margin-left:auto;margin-right:auto;">
                <div class="stat-card"><div class="number">📡</div><div class="label">API Keys</div></div>
                <div class="stat-card"><div class="number">🤖</div><div class="label">Bot Host</div></div>
                <div class="stat-card"><div class="number">📈</div><div class="label">Uptime Monitor</div></div>
                <div class="stat-card"><div class="number">🛡️</div><div class="label">Shield</div></div>
            </div>
        </div>
    </div>
</body>
</html>
